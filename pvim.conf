# pvim configuration (simple starter file).
#
# Copy this file to `~/.config/pvim/pvim.conf` and edit it there — your copy
# wins over this bundled example. Alternatively keep it here in the repo root;
# it is picked up from the working directory, from next to the executable,
# from $PVIM_CONFIG, or from ~/.config/pvim/.

# The theme to use, from the themes/ directory (see themes/*.theme).
#   default     current palette      solarized   blue/green/yellow
#   mono        one-colour starter
theme = default

# Line numbers in the gutter.
#   absolute    every line shows its own number (default)
#   relative    each line shows its distance from the cursor;
#               the cursor line shows its absolute number
#   off         no gutter
linenumbers = absolute

# Clipboard shortcut modifier. Copy and paste are bound to <mod>+y and
# <mod>+p respectively.
#   super       the Windows/Command key (default). Needs a terminal that
#               forwards it; kitty does, with no extra setup.
#   ctrl        works in every terminal
#   alt         works in most terminals
#   none        bind plain y / p instead
# In normal mode copy takes the current line; in visual mode it copies the
# selection. PVIM_CLIPBOARD_MOD overrides this for a single run.
clipboard_mod = super

# Optionally override individual colours right here — these win over the
# theme above. Values are XTerm-256 indices (0-255), a colour name, or
# `default` for the terminal's own foreground.
#
#   keyword1 = orange
#   keyword2 = green
#   string   = pink
#   number   = 203
#   macro    = blue
#   variable = 81
#   function = 228
#   comment  = 245
#
# Search matches and the visual selection are drawn as reverse-video blocks
# (they look like a terminal selection). Their colour becomes the block's
# background; `search_bold` / `selection_bold` brighten it.
#
#   search         = 226   # highlighted search matches (alias: match)
#   search_bold    = off   # on / off / true / false / 1 / 0
#   selection      = 240   # visual selection; -1 reuses the syntax colour
#   selection_bold = off
#
# The autocomplete menu is themed separately. The right column of each row
# shows the signature and a source badge ([LSP], [Snip] or [Buffer]).
#
#   completion_menu        = 231   # candidate label (left column)
#   completion_menu_detail = 245   # dimmed signature / detail (right column)
#   completion_menu_source = 45    # kind tag and source badge
#   completion_menu_select = 237   # selected-row background block
#   completion_menu_bg     = 236   # popup background
#   completion_menu_border = 45    # popup border

# Autocomplete. The menu offers words from clangd (when it is running for the
# file) plus words already in the buffer, and is anchored below the cursor.
#   completion         on    master switch for the popup (default on)
#   completion_auto    on    also open automatically while you type (default on)
#   completion_trigger       key that opens the menu on demand (default <C-Space>,
#                            which legacy terminals also send as a NUL byte)
#   completion_accept        key(s) that accept the highlighted item; a
#                            whitespace/comma separated list (default <CR> <Tab>)
# With completion_auto off the menu only opens on the trigger key. The trigger
# and accept keys use the same notation as the [bindings] section below. While
# the menu is open <C-n>/<Down> and <C-p>/<Up> move the selection and <Esc>
# cancels it.
completion = on
completion_auto = on
completion_trigger = <C-Space>
completion_accept = <CR> <Tab>

# Optional user key bindings. Every `map` line MUST live inside the
# [bindings] section below — a `map` line anywhere else in the file is
# ignored. Uncomment and edit the examples; the section may stay empty.
[bindings]

# Lines in this section map a key to a command (exactly the set `:` mode
# accepts: w/wq/x, q/q!, noh, diag, close, explore, reload). Bindings fire only
# in normal and visual mode; typing, `:`-commands and search are never
# intercepted, and they take precedence over the built-in commands and the
# clipboard shortcuts.
#
# Edit this file and run `:reload` to apply changes without restarting pvim.
#
#   map <C-s> :w
#   map <C-q> :q!
#   map <D-y> :w
#   map <F2> :diag
#   map g :wq
#
# Key notation follows vim: <C-x> Ctrl, <S-x> Shift (collapses to the
# uppercase byte), <A-x> / <M-x> Alt/Meta, <D-x> Super, <F1>-<F12>, and named
# keys such as <CR>, <Esc>, <Tab>, <BS>, <Space> and the arrows. A bare
# character binds as-is. An inline `#` comment, a leading `:` and a trailing
# <CR>/<Enter> are all optional; `noremap` is accepted as a synonym for `map`.
# Anything that is not a map line, any key that fails to parse and any empty
# command is ignored.