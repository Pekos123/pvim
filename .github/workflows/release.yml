name: Release

# Build a standalone Linux binary and publish it whenever a version tag is
# pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release needs write access to create the release.
permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure clang (Linux)
        if: runner.os == 'Linux'
        run: command -v clang || (sudo apt-get update && sudo apt-get install -y --no-install-recommends clang)

      # `make` compiles every object with the strict C99 flags.
      # For Linux, -static makes the result self-contained.
      # For macOS, we build a universal binary.
      - name: Build binary
        run: |
          make
          if [ "${{ runner.os }}" = "Linux" ]; then
            clang -static src/*.o -o pvim-linux-x86_64
            echo "ASSET=pvim-linux-x86_64" >> $GITHUB_ENV
          else
            clang -arch x86_64 -arch arm64 src/*.o -o pvim-macos-universal
            echo "ASSET=pvim-macos-universal" >> $GITHUB_ENV
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
